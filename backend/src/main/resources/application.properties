# SafeHarbor Backend Configuration
# Secrets are read from environment variables – see application.properties.example

spring.application.name=safeharbor
spring.profiles.default=dev

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/safeharbor_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.initialization-fail-timeout=0

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
safeharbor.jwt.secret=${JWT_SECRET}
safeharbor.jwt.expiration=86400000

# Server
server.port=8080
